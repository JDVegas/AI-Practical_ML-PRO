services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: my_backend_advanced_image:1.0
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000

  
  frontend: 
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: my_frontend_advanced_image:1.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_HOST: 0.0.0.0
    depends_on:
      - backend