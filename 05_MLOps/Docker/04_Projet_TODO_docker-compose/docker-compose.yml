services: 
  db: 
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todolist_db
    volumes:
      - postgres_data:/var/lib/postgresql

  backend: 
    build: ./backend
    image: my_backend_image:1.0
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/todolist_db
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000

  frontend:
    build: ./frontend
    image: my_frontend_image:1.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_HOST: 0.0.0.0


volumes:
  postgres_data: