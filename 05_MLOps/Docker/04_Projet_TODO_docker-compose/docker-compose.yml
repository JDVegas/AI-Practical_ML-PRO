services: 
  db: 
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  backend: 
    build: ./backend
    image: my_backend_image:1.0
    depends_on:
      db:
         condition: service_healthy
    env_file:
      - ./backend/.env 
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000

  frontend:
    build: ./frontend
    image: my_frontend_image:1.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_HOST: 0.0.0.0


volumes:
  postgres_data: